name: 功能建议
description: 建议新的审计工作流或产品能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述通用需求，不要上传或转述任何客户项目资料。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认建议中不含客户、个人、项目或内部系统信息。
          required: true
